services:
  - type: web
    name: ligatec-web
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.20.2"
      - key: SERVE_STATIC
        value: "true"
      - key: API_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_SSL
        value: "true"
      - key: IMAGE_STORAGE_PROVIDER
        value: supabase
      - key: IMAGE_UPLOAD_MAX_BYTES
        value: "1800000"
      - key: SUPABASE_STORAGE_BUCKET
        value: ligatec-images
      - key: SHOW_RECOVERY_CODE_IN_RESPONSE
        value: "false"
      - key: SEED_DEMO_USERS
        value: "false"
      - key: VITE_API_BASE_URL
        value: /api
      - key: PUBLIC_CACHE_SECONDS
        value: "5"
      - key: BACKUP_STORAGE_BUCKET
        value: ligatec-backups
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
