services:
  - type: web
    name: liga-futbol-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:api:postgres
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_SSL
        value: "true"
      - key: SHOW_RECOVERY_CODE_IN_RESPONSE
        value: "false"
      - key: TOKEN_TTL_HOURS
        value: "8"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: AUTH_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
